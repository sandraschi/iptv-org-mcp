[project]
name = "iptv-org-mcp"
version = "0.2.1"
description = "iptv-org MCP server - curated free linear TV: channel discovery, health-filtered M3U builder, EPG guide lookup, VLC + Jellyfin handoff"
authors = [
    { name = "Sandra Schipal", email = "sandraschipal@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "prefab-ui>=0.18.0",
]

[project.scripts]
iptv-org-mcp = "iptv_org_mcp.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "pyright>=1.1.390", "ruff>=0.16.0,<0.17", "pre-commit>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iptv_org_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "RUF", "T20"]
ignore = ["RUF001", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=iptv_org_mcp --cov-report=term-missing --cov-fail-under=30"
