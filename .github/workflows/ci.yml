name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright src
      - run: uv run pytest -q
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: web_sota
      - run: bun run biome:ci
        working-directory: web_sota
      - run: bun run check
        working-directory: web_sota

  e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: oven-sh/setup-bun@v2
      - run: uv sync --group dev
      - run: bun install --frozen-lockfile
        working-directory: web_sota
      - run: bunx playwright install chromium
        working-directory: web_sota
      - name: start backend
        run: Start-Process -FilePath "uv" -ArgumentList "run python -m iptv_org_mcp --serve --port 11242" -PassThru | Out-Null; Start-Sleep -Seconds 12
      - name: start frontend
        run: Start-Process -FilePath "bun" -ArgumentList "run dev" -WorkingDirectory "web_sota" -PassThru | Out-Null; Start-Sleep -Seconds 12
      - name: warm upstream cache (cold snapshots are slow)
        run: Invoke-WebRequest 'http://127.0.0.1:11242/api/iptv/refresh' -UseBasicParsing -Method POST -TimeoutSec 600 | Out-Null
      - run: bun run e2e
        working-directory: web_sota
