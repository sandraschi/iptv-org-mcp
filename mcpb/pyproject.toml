[project]
name = "iptv-org-mcp"
version = "0.2.0"
description = "iptv-org MCP server - curated free linear TV (bundle build)"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iptv_org_mcp"]
